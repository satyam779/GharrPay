name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  deploy:
    name: Deploy GharrPay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          ssh_strict_host_key_checking: false
          envs: MONGO_URI,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -e
            APP_DIR=/opt/gharrpay

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> First-time setup: provisioning instance..."
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -y
              sudo apt-get install -y curl build-essential git nginx
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
              sudo apt-get install -y nodejs
              sudo npm install -g pm2
              sudo mkdir -p /var/log/gharrpay

              sudo git clone https://github.com/satyam779/GharrPay.git "$APP_DIR"
              cd "$APP_DIR"

              sudo tee backend/.env >/dev/null <<EOF
              MONGO_URI=$MONGO_URI
              PORT=5000
              ADMIN_USERNAME=$ADMIN_USERNAME
              ADMIN_PASSWORD=$ADMIN_PASSWORD
              JWT_SECRET=$(openssl rand -hex 32)
              CORS_ORIGIN=http://localhost:5173
              TRUST_PROXY=1
              EOF

              sudo npm ci --prefix backend
              sudo npm ci --prefix frontend
              sudo npm run build --prefix frontend

              sudo cp deploy/nginx-gharrpay.conf /etc/nginx/sites-available/gharrpay
              sudo ln -sf /etc/nginx/sites-available/gharrpay /etc/nginx/sites-enabled/gharrpay
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t
              sudo systemctl reload nginx || sudo systemctl restart nginx

              sudo pm2 start deploy/ecosystem.config.js
              sudo pm2 save
              sudo pm2 startup systemd -u root --hp /root || true
            else
              echo "==> Updating existing deployment..."
              cd "$APP_DIR"
              sudo GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull
              sudo npm ci --prefix backend
              sudo npm ci --prefix frontend
              sudo npm run build --prefix frontend
              sudo pm2 restart gharrpay
              sudo pm2 save
            fi
