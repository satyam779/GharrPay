name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  deploy:
    name: Deploy GharrPay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          envs: MONGO_URI,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -e
            APP_DIR=/opt/gharrpay
            export DEBIAN_FRONTEND=noninteractive

            echo "==> Ensuring system packages..."
            sudo apt-get update -y
            sudo apt-get install -y curl build-essential git nginx

            if ! command -v node >/dev/null 2>&1; then
              echo "==> Installing Node.js 22..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
              sudo apt-get install -y nodejs
            fi

            echo "==> Installing PM2..."
            sudo npm install -g pm2

            echo "==> Cloning repository..."
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo git clone https://github.com/satyam779/GharrPay.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            echo "==> Writing backend/.env if missing..."
            if [ ! -f backend/.env ]; then
              {
                echo "MONGO_URI=$MONGO_URI"
                echo "PORT=5000"
                echo "ADMIN_USERNAME=$ADMIN_USERNAME"
                echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
                echo "JWT_SECRET=$(openssl rand -hex 32)"
                echo "CORS_ORIGIN=http://localhost:5173"
                echo "TRUST_PROXY=1"
              } | sudo tee backend/.env >/dev/null
            fi

            echo "==> Updating code..."
            sudo GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull

            echo "==> Installing dependencies..."
            sudo npm ci --prefix backend
            sudo npm ci --prefix frontend

            echo "==> Building frontend..."
            sudo npm run build --prefix frontend

            echo "==> Ensuring nginx is configured..."
            sudo cp deploy/nginx-gharrpay.conf /etc/nginx/sites-available/gharrpay
            sudo ln -sf /etc/nginx/sites-available/gharrpay /etc/nginx/sites-enabled/gharrpay
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "==> Ensuring PM2 process is running..."
            sudo mkdir -p /var/log/gharrpay
            sudo pm2 describe gharrpay >/dev/null 2>&1 && sudo pm2 restart gharrpay || sudo pm2 start deploy/ecosystem.config.js
            sudo pm2 save
            sudo pm2 startup systemd -u root --hp /root || true

            echo "==> Waiting for app to start..."
            sleep 6

            echo "==> PM2 status:"
            sudo pm2 status

            echo "==> Last app logs:"
            sudo pm2 logs gharrpay --lines 30 --nostream || true

            echo "==> Health check:"
            curl -sS --retry 5 --retry-connrefused --retry-delay 3 http://127.0.0.1:5000/api/health || true
