# GharrPay nginx site config (HTTP, IP-based access)
# Reverse-proxies port 80 -> Node app on 127.0.0.1:5000
#
# Install: sudo cp deploy/nginx-gharrpay.conf /etc/nginx/sites-available/gharrpay
#          sudo ln -s /etc/nginx/sites-available/gharrpay /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Use your EC2 public IPv4 here (or a domain name if you add one later)
    server_name _;

    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
